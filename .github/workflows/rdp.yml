          echo 		^<Setting name="Show quickconnect bar"^>1^</Setting^>
          echo 		^<Setting name="Messagelog position"^>0^</Setting^>
          echo 		^<Setting name="File doubleclick action"^>0^</Setting^>
          echo 		^<Setting name="Dir doubleclick action"^>0^</Setting^>
          echo 		^<Setting name="Minimize to tray"^>0^</Setting^>

          echo 		^<Setting name="Filelist directory sort"^>0^</Setting^>
          echo 		^<Setting name="Filelist name sort"^>0^</Setting^>
          echo 		^<Setting name="Queue successful autoclear"^>0^</Setting^>
          echo 		^<Setting name="Show message log"^>1^</Setting^>

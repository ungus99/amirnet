name: RDP Windows VPS (Bore)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Otomatis run ulang setiap 5 jam

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and Extract Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore

      - name: Enable RDP + Create Admin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $pass = ConvertTo-SecureString "WindowsRDP2026@" -AsPlainText -Force
          New-LocalUser "admin" -Password $pass -FullName "admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin"
          Add-LocalGroupMember -Group "Administrators" -Member "admin"

      - name: Optimasi Registry 4K (Grafik Mulus)
        run: |
          $tsPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPath)) { New-Item -Path $tsPath -Force }
          Set-ItemProperty -Path $tsPath -Name "fEnableVirtualizedGraphics" -Value 1 -Type DWord
          Set-ItemProperty -Path $tsPath -Name "MinFrameRate" -Value 120 -Type DWord

      - name: Setup Auto Run auto.bat
        shell: bash
        run: |
          mkdir -p "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/StartUp"
          cat << 'EOF' > "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/StartUp/auto.bat"
          @echo off
          :: Memeriksa apakah script sudah berjalan sebagai Administrator
          net session >nul 2>&1
          if %errorLevel% == 0 (
              goto :RunScript
          ) else (
              :: Jika belum, otomatis me-restart script ini dengan hak Administrator
              powershell -Command "Start-Process -Verb RunAs -FilePath '%0'"
              exit /b
          )

          :RunScript
          echo ========================================================
          echo MENGOPTIMALKAN WINDOWS UNTUK PERFORMA MAKSIMAL (ANTI-LAG)
          echo ========================================================
          echo.

          :: Mematikan semua efek visual (Animasi, bayangan, dll)
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f

          :: Mematikan efek jendela saat digeser
          reg add "HKCU\Control Panel\Desktop" /v DragFullWindows /t REG_SZ /d 0 /f

          :: Mematikan penghalus huruf (Font Smoothing) agar render teks lebih ringan
          reg add "HKCU\Control Panel\Desktop" /v FontSmoothing /t REG_SZ /d 0 /f

          :: Mematikan service background yang sering bikin disk usage 100%
          net stop "SysMain" /y
          sc config "SysMain" start=disabled

          echo.
          echo ========================================================
          echo MENGINSTAL DAN MENGONFIGURASI FILEZILLA
          echo ========================================================
          echo.

          echo Mengunduh FileZilla...
          curl -L -o "%TEMP%\FileZilla_Setup.exe" "https://download.filezilla-project.org/client/FileZilla_3.70.6_win64_sponsored2-setup.exe"

          echo Menginstal FileZilla (Silent Mode)...
          start /wait "" "%TEMP%\FileZilla_Setup.exe" /S

          echo Mengatur konfigurasi XML dan Layout FileZilla...
          mkdir "%APPDATA%\FileZilla" 2>nul

          (
          echo ^<?xml version="1.0"?^>
          echo ^<FileZilla3 version="3.70.6" platform="windows"^>
          echo 	^<Settings^>
          echo 		^<Setting name="Maximum simultaneous transfers"^>10^</Setting^>
          echo 		^<Setting name="Use Pasv mode"^>1^</Setting^>
          echo 		^<Setting name="Limit local ports"^>0^</Setting^>
          echo 		^<Setting name="Limit ports low"^>6000^</Setting^>
          echo 		^<Setting name="Limit ports high"^>7000^</Setting^>
          echo 		^<Setting name="Limit ports offset"^>0^</Setting^>
          echo 		^<Setting name="External IP mode"^>0^</Setting^>
          echo 		^<Setting name="External IP" /^>
          echo 		^<Setting name="External address resolver"^>http://ip.filezilla-project.org/ip.php^</Setting^>
          echo 		^<Setting name="Last resolved IP" /^>
          echo 		^<Setting name="No external ip on local conn"^>1^</Setting^>
          echo 		^<Setting name="Pasv reply fallback mode"^>0^</Setting^>
          echo 		^<Setting name="Timeout"^>20^</Setting^>
          echo 		^<Setting name="Logging Debug Level"^>0^</Setting^>
          echo 		^<Setting name="Logging Raw Listing"^>0^</Setting^>
          echo 		^<Setting name="Allow transfermode fallback"^>1^</Setting^>
          echo 		^<Setting name="Reconnect count"^>2^</Setting^>
          echo 		^<Setting name="Reconnect delay"^>5^</Setting^>
          echo 		^<Setting name="Enable speed limits"^>0^</Setting^>
          echo 		^<Setting name="Speedlimit inbound"^>1000^</Setting^>
          echo 		^<Setting name="Speedlimit outbound"^>100^</Setting^>
          echo 		^<Setting name="Speedlimit burst tolerance"^>0^</Setting^>
          echo 		^<Setting name="Preallocate space"^>0^</Setting^>
          echo 		^<Setting name="View hidden files"^>0^</Setting^>
          echo 		^<Setting name="Preserve timestamps"^>0^</Setting^>
          echo 		^<Setting name="Socket recv buffer size (v2)"^>4194304^</Setting^>
          echo 		^<Setting name="FTP Keep-alive commands"^>0^</Setting^>
          echo 		^<Setting name="FTP Proxy type"^>0^</Setting^>
          echo 		^<Setting name="FTP Proxy host" /^>

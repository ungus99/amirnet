          echo 		^<Setting name="Queue completion command" /^>
          echo 		^<Setting name="Drag and Drop disabled"^>0^</Setting^>
          echo 		^<Setting name="Disable update footer"^>0^</Setting^>
          echo 		^<Setting name="Highest shown overlay id"^>0^</Setting^>
          echo 		^<Setting name="Resolve local symlinks" platform="win"^>1^</Setting^>
          echo 		^<Setting name="Last automatic update check"^>2026-08-01 16:10:56^</Setting^>
          echo 		^<Setting name="Greeting version"^>3.70.6^</Setting^>
          echo 		^<Setting name="Prompt password save"^>1^</Setting^>
          echo 		^<Setting name="Last automatic update version"^>3.70.6^</Setting^>
          echo 		^<Setting name="Update Check New Version" platform="win"^>nightly 2026-08-01 https://filezilla-project.org/nightlies/2026-08-01/win64/FileZilla_3_setup.exe 12770544 sha512 0bce4f0ffcd6607fb2dc8f980a3b8cc00943b95848551abd5c4e74095806607aaf87f907f4bd824110bed1a8a588d0cd4383bd7cb767dc587b7b94c8736c2a16 sig:qcw5bpsJovJwf6sLPDHtlPr2e2O6nK4+4EVnSWdPuSAnr8OGNORO3UnNpgQTd6y4Q3gt4eNfIj6beswQCq+ZCA
          echo release 3.70.6 https://dl1.cdn.filezilla-project.org/FileZilla_3.70.6_win64-setup.exe 12726408 sha512 2fd8b5393a460e33ef4e1e83984189978f8f5d4d03d8e14f4dc99d28cdc9b33e7a19ec8885361392994239896327ab56d10a4b765d4fab6e4dede65efca37ec1 sig:lmW1AzRCV5gHztk9Xgl+v13ZwbHpJkL/IdH23IENXx5Oin1a4PuCYLSgNBNQQgrqoYl0//aYpNyRvKVrDp1qDg
          echo ^</Setting^>
          echo 		^<Setting name="Queue column widths"^>180 60 180 80 60 150^</Setting^>
          echo 		^<Setting name="Local filelist colwidths"^>170 80 120 120^</Setting^>
          echo 		^<Setting name="Remote filelist colwidths"^>150 75 80 100 80 85^</Setting^>
          echo 		^<Setting name="Window position and size"^>0 360 41 1184 840 ^</Setting^>
          echo 		^<Setting name="Local filelist shown columns"^>1111^</Setting^>
          echo 		^<Setting name="Remote filelist shown columns"^>111111^</Setting^>
          echo 		^<Setting name="Local filelist column order"^>0,1,2,3^</Setting^>
          echo 		^<Setting name="Remote filelist column order"^>0,1,2,3,4,5^</Setting^>
          echo 		^<Setting name="Local filelist sortorder"^>0 0^</Setting^>
          echo 		^<Setting name="Remote filelist sortorder"^>0 0^</Setting^>
          echo 		^<Setting name="Update Check"^>0^</Setting^>
          echo 		^<Setting name="Number of Transfers"^>10^</Setting^>
          echo 		^<Setting name="Time Format"^>0^</Setting^>
          echo 		^<Setting name="Date Format"^>0^</Setting^>
          echo 		^<Setting name="Default editor" platform="win"^>0^</Setting^>
          echo 		^<Setting name="Splitter positions (v2)"^>97 -632 500000000 50 50 500000000^</Setting^>
          echo 		^<Setting name="Tab data" sensitive="1"^>
          echo 			^<Tabs^>
          echo 				^<Tab selected="1"^>
          echo 					^<Host /^>
          echo 					^<Port^>21^</Port^>
          echo 					^<Protocol^>-1^</Protocol^>
          echo 					^<Logontype^>0^</Logontype^>
          echo 					^<BypassProxy^>0^</BypassProxy^>
          echo 					^<Site^>^</Site^>
          echo 					^<RemotePath^>^</RemotePath^>
          echo 					^<LocalPath^>C:\Users\admin\^</LocalPath^>
          echo 				^</Tab^>
          echo 			^</Tabs^>
          echo 		^</Setting^>
          echo 	^</Settings^>
          echo ^</FileZilla3^>
          ) > "%APPDATA%\FileZilla\filezilla.xml"

          (
          echo ^<?xml version="1.0"?^>
          echo ^<FileZilla3 version="3.70.6" platform="windows"^>
          echo 	^<Layout Builddate="2026-06-04" Buildtime="14:53:46"^>
          echo 		^<Resources /^>
          echo 		^<Language id="en_US" date="1780584876"^>
          echo 			^<Font font="1;9;-12;0;0;0;400;0;0;0;1;0;0;5;0;Segoe UI" width="669" height="15" /^>
          echo 			^<Dialog name="Settings" width="449" /^>
          echo 		^</Language^>
          echo 	^</Layout^>
          echo ^</FileZilla3^>
          ) > "%APPDATA%\FileZilla\layout.xml"

          echo Mengunduh AutoDownloader.exe...
          curl -L -o "%USERPROFILE%\Desktop\AutoDownloader.exe" "https://www.dropbox.com/scl/fi/s4h2cp5he09gz2z3aoo5r/AutoDownloader.exe?rlkey=lntuysb790s6gg7ywgi66lvrx&st=nob074sf&dl=1"

          echo.
          echo ========================================================
          echo MEMBUAT SHORTCUT CHROME KHUSUS (INCOGNITO + ADOBE STOCK)
          echo ========================================================
          :: Setup variabel Environment untuk URL agar mudah dibaca oleh PowerShell dan menghindari masalah escape karakter
          set "ADOBE_URL=https://auth.services.adobe.com/en_US/index.html?callback=https%%3A%%2F%%2Fims-na1.adobelogin.com%%2Fims%%2Fadobeid%%2FAdobeStockContributor1%%2FAdobeID%%2Fcode%%3Fredirect_uri%%3Dhttps%%253A%%252F%%252Fcontributor.stock.adobe.com%%252F%%253Fisa0%%253D1%%26code_challenge_method%%3Dplain%%26use_ms_for_expiry%%3Dtrue&client_id=AdobeStockContributor1&scope=AdobeID%%2Copenid%%2Ccreative_cloud%%2Ccreative_sdk%%2Ccc_private%%2Cgnav%%2Csao.stock%%2Cadditional_info.address.mail_to%%2Cadditional_info.roles%%2Cread_organizations%%2Cread_pc.stock%%2Csao.cce_private%%2Cpps.read%%2Csecurity_phone.status.r%%2Cportfolio.sdk.import&relay=681b1aaa-4524-429d-a843-bd82c376f9b6&locale=en_US&flow_type=code&dctx_id=v%%3A2%%2Cs%%2Cad62dff0-679d-11f0-ae3d-0773325bce27&idp_flow_type=login&ab_test=welcome-back&s_p=google%%2Cfacebook&response_type=code&code_challenge_method=plain&redirect_uri=https%%3A%%2F%%2Fcontributor.stock.adobe.com%%2F%%3Fisa0%%3D1&use_ms_for_expiry=true#/"
          set "CHROME_PATH=C:\Program Files\Google\Chrome\Application\chrome.exe"
          set "SHORTCUT_PATH=%USERPROFILE%\Desktop\Adobe Stock.lnk"

          :: Mengeksekusi PowerShell untuk menyusun shortcut di Desktop
          powershell -Command "$wshell = New-Object -ComObject WScript.Shell; $shortcut = $wshell.CreateShortcut($env:SHORTCUT_PATH); $shortcut.TargetPath = $env:CHROME_PATH; $clean_url = $env:ADOBE_URL -replace '%%%%', '%%'; $shortcut.Arguments = \"--incognito `\"$clean_url`\"\"; $shortcut.Save()"

          echo.
          echo ========================================================
          echo PROSES SELESAI!
          echo ========================================================
          echo RDP telah dioptimalkan (restart RDP agar efek maksimal).
          echo Membuka FileZilla dan Chrome dengan perbaikan Drag and Drop...

          :: MEMPERBAIKI BUG DRAG & DROP:
          explorer.exe "C:\Program Files\FileZilla FTP Client\filezilla.exe"
          explorer.exe "%USERPROFILE%\Desktop\Adobe Stock.lnk"
          
          :: Hapus otomatis script auto.bat agar tidak berulang saat login berikutnya
          del "%~f0"
          exit
          EOF

      - name: Monitor Bore Stream & Force Update File
        run: |
          $PASS = "WindowsRDP2026@"
          $USER = "admin"
          $lastFullAddress = ""

          git config --global user.name "Bot-RDP"
          git config --global user.email "bot@github.com"
          git config --global core.autocrlf false

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = ".\bore\bore.exe"
          $psi.Arguments = "local 3389 --to bore.pub"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $process = [System.Diagnostics.Process]::Start($psi)

          while (!$process.HasExited) {
              $line = $process.StandardOutput.ReadLine()
              if ($line -match "(?:listening at|remote forwarding at) (bore\.pub:\d+)") {
                  $fullAddress = $matches[1]
                  $portOnly = $fullAddress.Split(':')[1]

                  if ($fullAddress -ne $lastFullAddress) {
                      $lastFullAddress = $fullAddress
                      
                      if (Test-Path "rdp_info.txt") { Remove-Item "rdp_info.txt" -Force }

                      $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
                      $reportLines = @(
                        '=======================================================',
                        'RDP INFO - Amir Edition',
                        '=======================================================',
                        "FULL ADDRESS   : bore.pub:$portOnly",
                        "PORT           : $portOnly",
                        'HOST           : bore.pub',
                        '-------------------------------------------------------',
                        "Username       : $USER",
                        "Password       : $PASS",
                        "Created        : $createdAt",
                        '======================================================='
                      )
                      $report = ($reportLines -join "`r`n")
                      [System.IO.File]::WriteAllText("$(Get-Location)\rdp_info.txt", $report)
                      
                      git checkout main
                      git add rdp_info.txt
                      git commit -m "Update RDP Info [skip ci]"
                      git push origin main --force
                  }
              }
              Start-Sleep -Milliseconds 200
          }
